      document.documentElement.classList.add("record-sidebar-open-small");
    }
  } catch (error) {}
})();
</script>

<!--lg-game-fragment-fix-->
<script>
(function () {
  "use strict";
  function fixFragmentLinks() {
    var page = location.href.split("#")[0];
    var links = document.querySelectorAll('a[href^="#"]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute("href");
      if (href !== null && href.charAt(0) === "#") {
        links[i].setAttribute("href", page + href);
      }
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fixFragmentLinks);
  } else {
    fixFragmentLinks();
  }
})();
</script>
<!--/lg-game-fragment-fix-->

</head>

<header class="record-header">

</header>

<main class="record-shell">
  <aside class="record-sidebar" id="recordSidebar">
    <p class="record-sidebar-label">搜索目录</p>
    <button class="record-sidebar-toggle" id="recordSidebarToggle" type="button" aria-expanded="false" aria-controls="recordMenu">
      <span>搜索目录</span>
      <span class="record-sidebar-icon" aria-hidden="true"></span>
    </button>
    <nav class="record-menu" id="recordMenu" aria-label="会议记录目录"></nav>
  </aside>

  <section class="record-content" aria-label="会议记录正文">

      <div id="speakerTools"></div>

<script>
(function () {
  try {
    var base = document.querySelector("base[href]");
    if (base) {
      var href = base.href;
      if (href && new URL(href).origin !== window.location.origin) {
        base.parentNode.removeChild(base);
      }
    }
  } catch (error) {}
})();
</script>
