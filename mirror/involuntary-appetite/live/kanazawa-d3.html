<h1>The Man Who Measures the Clouds</h1>
<h2>Jan FABRE</h2>
<p>制作的构想来自于一个在监狱中成为鸟类学家的囚犯所说的话。仰望天空、高举规尺的人像，激发人们对生与死以及人身自由问题的思考。</p>
